<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>netlab sandbox embed host</title>
    <style>
      body {
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 32px 20px;
        display: grid;
        gap: 20px;
      }

      .host-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 240px;
        gap: 16px;
        align-items: start;
      }

      iframe {
        width: 100%;
        height: 640px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #0f172a;
      }

      aside {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #ffffff;
        padding: 16px;
      }

      .label {
        margin: 0 0 4px;
        font-size: 12px;
        font-weight: 700;
        color: #475569;
        text-transform: uppercase;
      }

      #progress {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Embedded netlab sandbox</h1>
      <div class="host-layout">
        <iframe id="netlab-frame" title="netlab sandbox"></iframe>
        <aside>
          <p class="label">Student progress</p>
          <p id="progress">Waiting for sandbox...</p>
        </aside>
      </div>
    </main>
    <script type="module" src="./host.js"></script>
  </body>
</html>
